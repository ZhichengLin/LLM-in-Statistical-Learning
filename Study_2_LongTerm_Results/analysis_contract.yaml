verification:
  entry_guard: Bound readiness verifies exact manifest inputs, contract, every code source, complete QC/fixture/guard
    inventories; independently derived R sample fingerprints must match Python QC.
  all_fit_membership_audit: Every saved model/computation matches its contracted sample; excluded participants absent.
  independent_recomputation:
  - verify_models.R
  - verify_outputs.py
  known_diagnostics: Unadjusted full-cohort GLS df.error fallback and singular task-adjusted confidence model remain
    strict diagnostic FAILs; numerical checks can PASS with overall QUALIFIED.
